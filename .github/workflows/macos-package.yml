name: macOS package

# Called by preview-release.yml for one vX.Y.Z release. Archives the universal app, signs it with Developer ID, notarizes
# it and saves the DMG, the Sparkle update ZIP, their .sha256, appcast.xml and work-fleet-update-macos.json as the
# release-macos artifact; the caller publishes every platform at once. Requires the settings in docs/deployment.md,
# including a Developer ID profile for this app's Keychain entitlement. No Installer certificate is needed.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to build
        type: string
        required: true
      version:
        description: Version in src/native/apple/config/WorkFleet.xcconfig (MARKETING_VERSION)
        type: string
        required: true
      summary:
        description: In-app update summary from docs/release-notes.md
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Archive, sign and notarize
    runs-on: macos-15
    timeout-minutes: 60
    env:
      WORK_FLEET_APP_ID: ${{ vars.WORK_FLEET_APP_ID }}
      WORK_FLEET_APPLE_TEAM_ID: ${{ vars.WORK_FLEET_APPLE_TEAM_ID }}
      WORK_FLEET_GOOGLE_PROJECT_ID: ${{ vars.WORK_FLEET_GOOGLE_PROJECT_ID }}
      WORK_FLEET_GOOGLE_MACOS_CLIENT_ID: ${{ vars.WORK_FLEET_GOOGLE_MACOS_CLIENT_ID }}
      WORK_FLEET_SPARKLE_PUBLIC_KEY: ${{ vars.WORK_FLEET_SPARKLE_PUBLIC_KEY }}
      WORK_FLEET_PRIVACY_URL: ${{ vars.WORK_FLEET_PRIVACY_URL }}
      WORK_FLEET_SUPPORT_URL: ${{ vars.WORK_FLEET_SUPPORT_URL }}
      WORK_FLEET_SUPPORT_EMAIL: ${{ vars.WORK_FLEET_SUPPORT_EMAIL }}
      APPLICATION_IDENTITY: ${{ vars.MACOS_APPLICATION_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify macOS runtime, host-shell and Drive regressions
        run: |
          python3 -B -m unittest discover -s tests -p 'test_macos_runtime.py' -v
          python3 -B -m unittest discover -s tests -p 'test_macos_host_shell.py' -v
          python3 -B -m unittest discover -s tests -p 'test_macos_google_drive.py' -v
          python3 -B -m unittest discover -s tests -p 'test_macos_release_feed.py' -v
      - name: Check settings
        run: |
          node scripts/check-config.mjs --platform macos
          [ -n "$APPLICATION_IDENTITY" ] || { echo 'Variable MACOS_APPLICATION_IDENTITY is not set.'; exit 1; }
          [ -n "$WORK_FLEET_SPARKLE_PUBLIC_KEY" ] || { echo 'Variable WORK_FLEET_SPARKLE_PUBLIC_KEY is not set.'; exit 1; }
      # A throwaway keychain holds the Developer ID identities and the notary profile for this job only.
      - name: Import signing identity, profile and notary credentials
        env:
          APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          for value in "$APPLICATION_P12" "$P12_PASSWORD" "$PROFILE" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER"; do
            [ -n "$value" ] || { echo 'A macOS signing or notarization secret is not set.'; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"; password="$(uuidgen)"
          echo "::add-mask::$password"
          echo "WORK_FLEET_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          openssl pkcs12 -in "$RUNNER_TEMP/identity.p12" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/certificate.pem"
          openssl x509 -in "$RUNNER_TEMP/certificate.pem" -outform DER -out "$RUNNER_TEMP/certificate.cer"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/release.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/release.provisionprofile" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(python3 scripts/check-macos-profile.py --profile "$RUNNER_TEMP/profile.plist" --certificate "$RUNNER_TEMP/certificate.cer" \
            --team "$WORK_FLEET_APPLE_TEAM_ID" --app-id "$WORK_FLEET_APP_ID")
          echo "WORK_FLEET_MACOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          for directory in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$directory"
            cp "$RUNNER_TEMP/release.provisionprofile" "$directory/$profile_uuid.provisionprofile"
          done
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials work-fleet-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$keychain"
      # Since 2026-10-12 hosted runners drop the HTTP/3 (UDP 443) connection that xcrun stapler opens to Apple's ticket
      # service ("The network connection was lost", error 68), while HTTPS over TCP works (actions/runner-images#14924,
      # GitHub's workaround). Blocking outbound UDP 443 for this job makes stapler fall back to TCP; the rule ends with
      # the job's virtual machine. Remove this step once that issue is fixed.
      - name: Send Apple's ticket requests over TCP
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Archive and package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo 'Secret SPARKLE_PRIVATE_KEY is not set.'; exit 1; }
          umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          export SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          bash scripts/macos/build-native-app.sh --platform macos --release --application-identity "$APPLICATION_IDENTITY" --provisioning-profile "$WORK_FLEET_MACOS_PROFILE_UUID"
          bash scripts/macos/package-native-app.sh --platform macos --method developer-id --application-identity "$APPLICATION_IDENTITY" \
            --provisioning-profile "$WORK_FLEET_MACOS_PROFILE_UUID" --notary-profile work-fleet-notary --dmg --no-pkg --update-summary "$SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            build/WorkFleet-${{ inputs.version }}-macos-universal.dmg
            build/WorkFleet-${{ inputs.version }}-macos-universal.dmg.sha256
            build/WorkFleet-${{ inputs.version }}-macos-universal.zip
            build/WorkFleet-${{ inputs.version }}-macos-universal.zip.sha256
            build/appcast.xml
            build/work-fleet-update-macos.json
          if-no-files-found: error
          # A re-run of this job replaces the artifact its failed attempt may have left.
          overwrite: true
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${WORK_FLEET_MACOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$WORK_FLEET_MACOS_PROFILE_UUID.provisionprofile" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$WORK_FLEET_MACOS_PROFILE_UUID.provisionprofile"
          fi
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/release.keychain-db"; fi
          rm -f "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key" \
            "$RUNNER_TEMP/release.provisionprofile" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/certificate.pem" "$RUNNER_TEMP/certificate.cer"
