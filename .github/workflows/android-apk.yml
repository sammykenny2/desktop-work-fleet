name: Android device APK

# Manual build only. Reuses the test signer and saves artifacts. With "release" it also publishes the APK as a GitHub
# prerelease tagged android-v<versionName from build.gradle.kts>, with the text of that version's entry in
# docs/release-notes.md. An existing tag or release is never replaced, and the release is created only after the APK is
# built and its signer verified, so a failed run leaves nothing published.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Also publish the APK as the android-v<version> GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      changes: ${{ steps.notes.outputs.changes }}
    env:
      WORK_FLEET_APP_ID: ${{ vars.WORK_FLEET_APP_ID }}
      WORK_FLEET_GOOGLE_PROJECT_ID: ${{ vars.WORK_FLEET_GOOGLE_PROJECT_ID }}
      WORK_FLEET_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.WORK_FLEET_GOOGLE_ANDROID_CLIENT_ID }}
      WORK_FLEET_GOOGLE_WEB_CLIENT_ID: ${{ vars.WORK_FLEET_GOOGLE_WEB_CLIENT_ID }}
      WORK_FLEET_ANDROID_DEBUG_SHA1: ${{ vars.WORK_FLEET_ANDROID_DEBUG_SHA1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Refuse a published version and read the release notes
        id: notes
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/platform-version.mjs --platform android)
          tag="android-v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists. Bump versionName in src/native/android/app/build.gradle.kts to publish another preview."
            exit 1
          fi
          # The version-bump commit writes this entry; a release cannot start without it.
          node scripts/release-notes.mjs --version "$version" > /dev/null
          {
            echo 'changes<<WORK_FLEET_RELEASE_NOTES'
            node scripts/release-notes.mjs --version "$version"
            echo 'WORK_FLEET_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: npm ci --ignore-scripts
      - run: npm run config:check -- --google --platform android
      - name: Restore the fixed test keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE" ] || { echo 'Secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set.'; exit 1; }
          [[ "$WORK_FLEET_ANDROID_DEBUG_SHA1" =~ ^([[:xdigit:]]{2}:){19}[[:xdigit:]]{2}$ ]] || { echo 'Variable WORK_FLEET_ANDROID_DEBUG_SHA1 must be a SHA-1 fingerprint.'; exit 1; }
          umask 077
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-debug.keystore"
          echo "WORK_FLEET_ANDROID_DEBUG_KEYSTORE=$RUNNER_TEMP/android-debug.keystore" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/work-fleet-gradle" >> "$GITHUB_ENV"
      - name: Run Android regressions
        run: bash src/native/android/gradlew -p src/native/android --no-daemon --console plain testDebugUnitTest
      - name: Build the APK at the recorded version
        run: bash scripts/linux/build-android-app.sh
      - name: Verify the APK signer and record the build
        id: package
        run: |
          version=$(node scripts/platform-version.mjs --platform android)
          apk="build/WorkFleet-$version-android-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$WORK_FLEET_ANDROID_DEBUG_SHA1" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$actual" = "$expected" ] || { echo 'APK signer differs from the registered test key; refusing to save it.'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Android %s\nCommit: %s\nRun: %s/%s/actions/runs/%s\nSigner SHA-1: %s\nInstall with adb install -r; Google OAuth must include this package and signer.\n' \
            "$version" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$WORK_FLEET_ANDROID_DEBUG_SHA1" > build/android-build.txt
          cat build/android-build.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: work-fleet-android-${{ steps.package.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/WorkFleet-${{ steps.package.outputs.version }}-android-debug.apk
            build/WorkFleet-${{ steps.package.outputs.version }}-android-debug.apk.sha256
            build/android-build.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove the temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-debug.keystore"

  publish:
    name: Publish the prerelease
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work-fleet-android-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGES: ${{ needs.build.outputs.changes }}
        run: |
          cd dist && sha256sum -c "WorkFleet-$VERSION-android-debug.apk.sha256"
          cat > notes.md <<EOF
          Android preview APK built from ${GITHUB_SHA}. Requires Android 9 (API 28) or later.

          ${CHANGES}

          ## Installation
          Download \`WorkFleet-${VERSION}-android-debug.apk\` on the phone and open it, allowing installs from this source when Android asks, or run \`adb install -r WorkFleet-${VERSION}-android-debug.apk\`.
          The APK is signed with the project's fixed test key, not a Google Play key, so a later preview with a higher version installs over it and keeps your data; a build signed with another key cannot.
          Google sign-in is in testing: only accounts added as test users can sign in.
          EOF
          gh release create "android-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Work Fleet for Android $VERSION (preview)" --notes-file notes.md \
            "WorkFleet-$VERSION-android-debug.apk" "WorkFleet-$VERSION-android-debug.apk.sha256"
