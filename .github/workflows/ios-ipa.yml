name: iOS registered-device IPA

# Manual development build for registered devices; no TestFlight and no version bump. With "release" it also publishes
# the IPA as a GitHub prerelease tagged ios-v<MARKETING_VERSION>, with the text of that version's entry in
# docs/release-notes.md. An existing tag or release is never replaced, and the release is created only after the app is
# signed and verified, so a failed run leaves nothing published.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Also publish the IPA as the ios-v<version> GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      changes: ${{ steps.notes.outputs.changes }}
      devices: ${{ steps.package.outputs.devices }}
    env:
      WORK_FLEET_APP_ID: ${{ vars.WORK_FLEET_APP_ID }}
      WORK_FLEET_APP_GROUP_ID: ${{ vars.WORK_FLEET_APP_GROUP_ID }}
      WORK_FLEET_APPLE_TEAM_ID: ${{ vars.WORK_FLEET_APPLE_TEAM_ID }}
      WORK_FLEET_GOOGLE_PROJECT_ID: ${{ vars.WORK_FLEET_GOOGLE_PROJECT_ID }}
      WORK_FLEET_GOOGLE_IOS_CLIENT_ID: ${{ vars.WORK_FLEET_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Refuse a published version and read the release notes
        id: notes
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/platform-version.mjs --platform apple)
          tag="ios-v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists. Bump MARKETING_VERSION in src/native/apple/config/WorkFleet.xcconfig to publish another preview."
            exit 1
          fi
          # The version-bump commit writes this entry; a release cannot start without it.
          node scripts/release-notes.mjs --version "$version" > /dev/null
          {
            echo 'changes<<WORK_FLEET_RELEASE_NOTES'
            node scripts/release-notes.mjs --version "$version"
            echo 'WORK_FLEET_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run config:check -- --google --platform ios
      - name: Import the development identity and registered-device profiles
        env:
          DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          SHARE_PROFILE: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: |
          for value in "$DEVELOPMENT_P12" "$P12_PASSWORD" "$APP_PROFILE" "$SHARE_PROFILE" "$WORK_FLEET_APP_ID" "$WORK_FLEET_APPLE_TEAM_ID"; do
            [ -n "$value" ] || { echo 'An iOS signing secret or app/team variable is missing.'; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/ios-build.keychain-db"; password="$(uuidgen)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPMENT_P12" | base64 --decode > "$RUNNER_TEMP/ios-identity.p12"
          security import "$RUNNER_TEMP/ios-identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/ios-identity.p12" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/ios-certificate.pem"
          /usr/bin/openssl x509 -in "$RUNNER_TEMP/ios-certificate.pem" -outform DER -out "$RUNNER_TEMP/ios-certificate.cer"
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/ios-app.mobileprovision"
          printf '%s' "$SHARE_PROFILE" | base64 --decode > "$RUNNER_TEMP/ios-share.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/ios-app.mobileprovision" > "$RUNNER_TEMP/ios-app.plist"
          security cms -D -i "$RUNNER_TEMP/ios-share.mobileprovision" > "$RUNNER_TEMP/ios-share.plist"
          python3 scripts/check_ios_profiles.py --app-profile "$RUNNER_TEMP/ios-app.plist" --share-profile "$RUNNER_TEMP/ios-share.plist" \
            --certificate "$RUNNER_TEMP/ios-certificate.cer" --team "$WORK_FLEET_APPLE_TEAM_ID" --app-id "$WORK_FLEET_APP_ID" \
            --app-group "${WORK_FLEET_APP_GROUP_ID:-group.$WORK_FLEET_APP_ID}" > "$RUNNER_TEMP/ios-signing.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          settings = json.loads(Path(os.environ['RUNNER_TEMP'], 'ios-signing.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"WORK_FLEET_IOS_DEVICE_COUNT={settings['device_count']}\n")
          PY
      - name: Build and verify the signed app and extension
        run: |
          bash scripts/macos/build-native-app.sh --platform ios --unsigned
          python3 scripts/sign_ios_app.py --app build/apple/DerivedData/Build/Products/Debug-iphoneos/WorkFleetIOS.app \
            --app-profile "$RUNNER_TEMP/ios-app.mobileprovision" --share-profile "$RUNNER_TEMP/ios-share.mobileprovision" \
            --certificate "$RUNNER_TEMP/ios-certificate.cer" --team "$WORK_FLEET_APPLE_TEAM_ID" --app-id "$WORK_FLEET_APP_ID" \
            --app-group "${WORK_FLEET_APP_GROUP_ID:-group.$WORK_FLEET_APP_ID}" --keychain "$RUNNER_TEMP/ios-build.keychain-db"
      - name: Package the IPA at the recorded version
        id: package
        run: |
          bash scripts/macos/package-preview-app.sh --platform ios
          version=$(node scripts/platform-version.mjs --platform apple)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "devices=$WORK_FLEET_IOS_DEVICE_COUNT" >> "$GITHUB_OUTPUT"
          printf 'iOS %s\nCommit: %s\nRun: %s/%s/actions/runs/%s\nRegistered devices: %s\nInstall via Xcode/Apple Configurator on a profile-authorized device with Developer Mode enabled.\n' \
            "$version" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$WORK_FLEET_IOS_DEVICE_COUNT" > build/ios-build.txt
          cat build/ios-build.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save IPA and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: work-fleet-ios-${{ steps.package.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/WorkFleet-${{ steps.package.outputs.version }}-ios-development.ipa
            build/WorkFleet-${{ steps.package.outputs.version }}-ios-development.ipa.sha256
            build/ios-build.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ios-build.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/ios-build.keychain-db"; fi
          rm -f "$RUNNER_TEMP/ios-identity.p12" "$RUNNER_TEMP/ios-certificate.pem" "$RUNNER_TEMP/ios-certificate.cer" \
            "$RUNNER_TEMP/ios-app.mobileprovision" "$RUNNER_TEMP/ios-share.mobileprovision" \
            "$RUNNER_TEMP/ios-app.plist" "$RUNNER_TEMP/ios-share.plist" "$RUNNER_TEMP/ios-signing.json"

  publish:
    name: Publish the prerelease
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: work-fleet-ios-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGES: ${{ needs.build.outputs.changes }}
          DEVICES: ${{ needs.build.outputs.devices }}
        run: |
          cd dist && sha256sum -c "WorkFleet-$VERSION-ios-development.ipa.sha256"
          cat > notes.md <<EOF
          iOS preview IPA built from ${GITHUB_SHA}. Requires iOS 16 or later.

          ${CHANGES}

          ## Installation
          This is a development-signed build for the ${DEVICES} device(s) registered in the project's provisioning profile; other devices cannot install it, and there is no TestFlight or App Store build yet.
          On a registered device with Developer Mode turned on, install \`WorkFleet-${VERSION}-ios-development.ipa\` with Apple Configurator or Xcode (Window > Devices and Simulators).
          Google sign-in is in testing: only accounts added as test users can sign in.
          EOF
          gh release create "ios-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Work Fleet for iOS $VERSION (preview)" --notes-file notes.md \
            "WorkFleet-$VERSION-ios-development.ipa" "WorkFleet-$VERSION-ios-development.ipa.sha256"
