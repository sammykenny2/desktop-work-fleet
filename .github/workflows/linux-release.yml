name: Linux preview release

# Manual only. Builds the DEB from the selected commit and publishes a GitHub prerelease tagged
# linux-v<version from src/native/linux/VERSION>, with the DEB, its .sha256 and work-fleet-update.json for the in-app
# updater (ADR-044). An existing tag or release is never replaced: bump the version to publish another preview. The
# release is created only after the package is built, so a failed run leaves nothing published.
# The release text and the in-app update summary come from the version's entry in docs/release-notes.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  guard:
    name: Check version and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      summary: ${{ steps.notes.outputs.summary }}
      changes: ${{ steps.notes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Resolve the release tag
        id: version
        run: |
          version=$(node scripts/platform-version.mjs --platform linux)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=linux-v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a version that was already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists. Bump src/native/linux/VERSION to publish another preview."
            exit 1
          fi
      - name: Read the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The version-bump commit writes this entry; a release cannot start without it.
          node scripts/release-notes.mjs --version "$VERSION" > /dev/null
          {
            echo "summary=$(node scripts/release-notes.mjs --version "$VERSION" --summary)"
            echo 'changes<<WORK_FLEET_RELEASE_NOTES'
            node scripts/release-notes.mjs --version "$VERSION"
            echo 'WORK_FLEET_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Build the DEB
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # A preview that cannot sign in to Google is not worth installing on another machine.
      - name: Check Google settings
        env:
          WORK_FLEET_GOOGLE_PROJECT_ID: ${{ vars.WORK_FLEET_GOOGLE_PROJECT_ID }}
          WORK_FLEET_GOOGLE_LINUX_CLIENT_ID: ${{ vars.WORK_FLEET_GOOGLE_LINUX_CLIENT_ID }}
          HAS_SECRET: ${{ secrets.WORK_FLEET_GOOGLE_LINUX_CLIENT_SECRET != '' }}
        run: |
          node scripts/check-config.mjs --google --platform linux
          [ "$HAS_SECRET" = true ] || { echo 'Secret WORK_FLEET_GOOGLE_LINUX_CLIENT_SECRET is not set.'; exit 1; }
      - name: Build the package
        env:
          WORK_FLEET_GOOGLE_PROJECT_ID: ${{ vars.WORK_FLEET_GOOGLE_PROJECT_ID }}
          WORK_FLEET_GOOGLE_LINUX_CLIENT_ID: ${{ vars.WORK_FLEET_GOOGLE_LINUX_CLIENT_ID }}
          WORK_FLEET_GOOGLE_LINUX_CLIENT_SECRET: ${{ secrets.WORK_FLEET_GOOGLE_LINUX_CLIENT_SECRET }}
          SUMMARY: ${{ needs.guard.outputs.summary }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          bash scripts/linux/build-native-app.sh --deb --update-summary "$SUMMARY"
          test -f "build/work-fleet_${VERSION}_all.deb" && test -f build/work-fleet-update.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-preview
          path: |
            build/work-fleet_${{ needs.guard.outputs.version }}_all.deb
            build/work-fleet_${{ needs.guard.outputs.version }}_all.deb.sha256
            build/work-fleet-update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the prerelease
    needs: [guard, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-preview
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          CHANGES: ${{ needs.guard.outputs.changes }}
        run: |
          cd dist && sha256sum -c "work-fleet_${VERSION}_all.deb.sha256"
          cat > notes.md <<EOF
          Linux preview DEB built from ${COMMIT}. Requires the system GTK 3 and WebKitGTK 4.1 of Debian, Ubuntu or Raspberry Pi OS.

          ${CHANGES}

          ## Installation
          \`sudo apt install ./work-fleet_${VERSION}_all.deb\`

          Afterwards you can check for and install updates from the tray menu or Settings > Desktop > Version and updates; installing asks for the system password.
          Google sign-in is in testing: only accounts added as test users can sign in.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --prerelease \
            --title "Work Fleet for Linux $VERSION (preview)" --notes-file notes.md \
            "work-fleet_${VERSION}_all.deb" "work-fleet_${VERSION}_all.deb.sha256" work-fleet-update.json
