name: macOS native packages

# iOS device builds stay local: embedded profiles disclose registered device identifiers.

on:
  workflow_dispatch:
    inputs:
      job_minutes:
        description: Maximum runner minutes
        type: choice
        options: ['5', '10', '20']
        default: '10'

permissions:
  contents: read

concurrency:
  group: apple-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: ${{ fromJSON(inputs.job_minutes) }}
    env:
      PIN_IT_ANYWHERE_APP_ID: ${{ vars.PIN_IT_ANYWHERE_APP_ID }}
      PIN_IT_ANYWHERE_APP_GROUP_ID: ${{ vars.PIN_IT_ANYWHERE_APP_GROUP_ID }}
      PIN_IT_ANYWHERE_APPLE_TEAM_ID: ${{ vars.PIN_IT_ANYWHERE_APPLE_TEAM_ID }}
      PIN_IT_ANYWHERE_GOOGLE_PROJECT_ID: ${{ vars.PIN_IT_ANYWHERE_GOOGLE_PROJECT_ID }}
      PIN_IT_ANYWHERE_GOOGLE_MACOS_CLIENT_ID: ${{ vars.PIN_IT_ANYWHERE_GOOGLE_MACOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install asset dependencies
        run: npm ci --ignore-scripts
      - name: Compile native app and embedded extension
        run: bash scripts/macos/build-native-app.sh --platform macos --unsigned
      - name: Package native preview
        run: bash scripts/macos/package-preview-app.sh --platform macos
      - name: Save native packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-it-anywhere-macos-native-preview
          path: |
            build/PinItAnywhere-*-macos-universal-unsigned.zip
            build/PinItAnywhere-*-macos-universal-unsigned.zip.sha256
            build/apple/preview-macos/README.txt
            build/apple/preview-macos/toolchain.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-it-anywhere-macos-build-diagnostics
          path: build/apple/DerivedData/Logs/Build
          if-no-files-found: ignore
          retention-days: 7
