name: Preview release

# Manual only. Builds Windows, macOS, Linux and optionally Android from the selected commit on main and publishes one GitHub
# prerelease tagged v<version>, the version all four platform records hold (scripts/platform-version.mjs --release). The
# desktop apps find that release in the public release feed and read their own manifest in it (ADR-044). An existing tag
# or release is never replaced: bump the version to publish another preview. The release is created only after every
# selected platform is built and its files pass scripts/validate-release-assets.mjs, so a failed run leaves nothing published;
# "Re-run failed jobs" keeps the platforms that were built. The release text and the in-app update summary come from the
# version's entry in docs/release-notes.md. Procedure: docs/deployment.md, "Preview releases".

on:
  workflow_dispatch:
    inputs:
      include_android:
        description: Include the Android APK alongside the desktop installers
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  guard:
    name: Check version and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      summary: ${{ steps.notes.outputs.summary }}
      changes: ${{ steps.notes.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Resolve the release tag
        id: version
        run: |
          # Every selected platform builds the same commit on main with matching version records.
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Preview releases are built from main.'; exit 1; }
          version=$(node scripts/platform-version.mjs --release)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a version that was already published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists. Bump the four version records (docs/deployment.md) to publish another preview."
            exit 1
          fi
      - name: Read the release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The version-bump commit writes this entry; a release cannot start without it.
          node scripts/release-notes.mjs --version "$VERSION" > /dev/null
          {
            echo "summary=$(node scripts/release-notes.mjs --version "$VERSION" --summary)"
            echo 'changes<<PIN_IT_ANYWHERE_RELEASE_NOTES'
            node scripts/release-notes.mjs --version "$VERSION"
            echo 'PIN_IT_ANYWHERE_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm test

  windows:
    name: Windows
    needs: guard
    uses: ./.github/workflows/windows-package.yml
    with:
      commit: ${{ needs.guard.outputs.commit }}
      version: ${{ needs.guard.outputs.version }}
      summary: ${{ needs.guard.outputs.summary }}
    secrets: inherit

  linux:
    name: Linux
    needs: guard
    uses: ./.github/workflows/linux-package.yml
    with:
      commit: ${{ needs.guard.outputs.commit }}
      version: ${{ needs.guard.outputs.version }}
      summary: ${{ needs.guard.outputs.summary }}
    secrets: inherit

  macos:
    name: macOS
    needs: guard
    uses: ./.github/workflows/macos-package.yml
    with:
      commit: ${{ needs.guard.outputs.commit }}
      version: ${{ needs.guard.outputs.version }}
      summary: ${{ needs.guard.outputs.summary }}
    secrets: inherit

  android:
    name: Android
    needs: guard
    if: ${{ inputs.include_android }}
    uses: ./.github/workflows/android-apk.yml
    with:
      commit: ${{ needs.guard.outputs.commit }}
    secrets: inherit

  publish:
    name: Publish the prerelease
    needs: [guard, windows, linux, macos, android]
    # A deliberately skipped Android build is allowed; a failed or cancelled selected build never publishes.
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success' && needs.windows.result == 'success' &&
          needs.linux.result == 'success' && needs.macos.result == 'success' &&
          (needs.android.result == 'success' || (!inputs.include_android && needs.android.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check the release files
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          INCLUDE_ANDROID: ${{ inputs.include_android }}
        run: |
          args=()
          if [ "$INCLUDE_ANDROID" = false ]; then args+=(--desktop-only); fi
          node scripts/validate-release-assets.mjs --dir dist --version "$VERSION" --repository "$GITHUB_REPOSITORY" "${args[@]}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          CHANGES: ${{ needs.guard.outputs.changes }}
          INCLUDE_ANDROID: ${{ inputs.include_android }}
          PLATFORMS: ${{ inputs.include_android && 'Windows, macOS, Linux and Android' || 'Windows, macOS and Linux' }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Preview of Pin It Anywhere ${VERSION} for ${PLATFORMS}, built from ${COMMIT}.

          ${CHANGES}

          ## Before installing
          Export a complete backup from the old app before changing installations or accounts, and keep the old app until your notes are accessible in the new one.
          For an existing current-identity preview, install the higher version over it to retain local data. Follow the version-specific compatibility notes above; signing out, uninstalling or resetting data is not a routine update step.
          Only when moving from the earlier identity used before 0.7.1: this preview uses the current Pin It Anywhere Google project and Apple application identity. Sign in to that project; the previous project's Google Drive notes are not imported automatically. Restore a supported backup deliberately if you need those notes.
          Desktop builds configured with the old repository cannot discover this release through its redirect. Only for those earlier builds: Download and install this preview manually once.

          ## Windows
          Requires Windows 11 (build 22000 or later). The package includes the .NET 10 Desktop Runtime, so .NET needs no separate installation; it uses the system's Evergreen WebView2 Runtime.
          If this computer already trusts the certificate included below, continue with step 3; certificate trust is required only once for that signer.
          1. Download \`PinItAnywhere-preview.cer\` from the assets below.
          2. Trust the certificate (once per computer). This needs administrator rights; without them, Windows answers "Access is denied" (E_ACCESSDENIED). Open the Start menu, search for PowerShell, right-click it and choose Run as administrator. Then run this command, changing the path if you saved the file somewhere else:

             \`\`\`powershell
             Import-Certificate -FilePath "\$HOME\\Downloads\\PinItAnywhere-preview.cer" -CertStoreLocation Cert:\\LocalMachine\\TrustedPeople
             \`\`\`
          3. Double-click \`PinItAnywhere-${VERSION}-x64.msix\` to install it.

          Only an installation from before the 0.7.1 identity cutover requires that manual transition. Keep that earlier app and its data until recovery is verified; its Windows package identity, Linux package name, updater manifests and V1 format names differ. Historical incompatible formats are not automatically converted.
          Subsequent higher versions with the same package identity and publisher install as upgrades and preserve that package's local files. Check the changes above for data-format compatibility before upgrading.
          Uninstalling removes all local data inside the package (including drafts, settings and the Google sign-in); export a ZIP from Settings > Data and backup first.
          Uninstalling does not affect exported ZIPs or Google cloud data. Moving data from a ZIP or Debug build requires a backup format supported by the target version; keep the earlier version available to read an incompatible backup.

          ## macOS
          Signed with Developer ID and notarized by Apple. Requires macOS 13 or later.
          Open \`PinItAnywhere-${VERSION}-macos-universal.dmg\` and drag Pin It Anywhere to Applications.

          ## Linux
          Requires the system GTK 3 and WebKitGTK 4.1 of Debian, Ubuntu or Raspberry Pi OS.
          \`sudo apt install ./pin-it-anywhere_${VERSION}_all.deb\`

          EOF
          if [ "$INCLUDE_ANDROID" = true ]; then
          cat >> "$RUNNER_TEMP/notes.md" <<EOF
          ## Android
          Android previews using the current application ID and Release signing key update in place. Only a move from an earlier application identity requires a separate installation; keep that earlier app and its backup until the new installation has the notes you need.
          Requires Android 9 (API 28) or later. Download \`PinItAnywhere-${VERSION}-android-release.apk\` on the phone and open it, allowing installs from this source when Android asks, or run \`adb install -r PinItAnywhere-${VERSION}-android-release.apk\` from a computer.
          This is a signed Release APK. Updates require the same application ID and signing key and a higher versionCode. It cannot replace a Debug APK signed with the old test key; export a backup before removing an old installation. Google Play signing is configured separately. Check the version-specific data compatibility and upgrade instructions above; do not reset data as a routine update step.

          EOF
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<EOF
          ## Updates
          On Windows, macOS and Linux, check for and install updates from the tray (the menu bar on macOS) or Settings > Desktop > Version and updates. Installing on Linux asks for the system password; on macOS, Sparkle downloads, verifies and reopens the app.
          Older repository settings and desktop installs of 0.3.6 or earlier require the manual transition described above. The new build uses the pin-it-anywhere repository for subsequent update checks.
          Google sign-in is in testing: only accounts added as test users can sign in.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --prerelease \
            --title "Pin It Anywhere $VERSION (preview)" --notes-file "$RUNNER_TEMP/notes.md" dist/*
